services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: teamform
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build:
      context: .            # repo root: the Dockerfile COPYs db/ and apps/api/
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/teamform
      JWT_SECRET: dev-secret-change-me
      ALLOW_DEV_LOGIN: "true"
      CORS_ORIGIN: "http://localhost:5173"
      PORT: "3000"
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy
    # No command override: the image CMD migrates, then runs the real
    # TypeScript entrypoint (npx tsx apps/api/src/server.ts).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["5173:80"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  pgdata:
