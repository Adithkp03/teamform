name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teamform_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/teamform_test
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Typecheck API + web
        run: |
          npm run typecheck -w @teamform/api
          npm run typecheck -w @teamform/web
      - name: Run API tests (incl. 50-way race, idempotency, authz)
        run: npm run test -w @teamform/api
      - name: Serverless bundle is in sync with src (Vercel deploys the bundle)
        run: |
          npm run bundle -w @teamform/api
          git diff --exit-code --stat apps/api/api/index.mjs
      - name: Build web
        run: npm run build -w @teamform/web
