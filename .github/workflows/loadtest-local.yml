name: Load test (CI stack)
on: [push, workflow_dispatch]
jobs:
  k6-local:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teamform_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/teamform_test
      JWT_SECRET: ci-loadtest-secret
      EVENTS_POLL_MS: '1000'
      REALTIME_MODE: poll
      ALLOW_DEV_LOGIN: 'false'
      PORT: '3000'
      PG_POOL_MAX: '10'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Migrate + seed (10,000 users / 2,000 teams)
        run: |
          npm run migrate
          node db/seed-sql.mjs
      - name: Start API (waits for health)
        run: |
          nohup npx tsx apps/api/src/server.ts > api-ci.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3000/api/health && break || sleep 1; done
      - name: Sign up the load user
        run: |
          TOKEN=$(curl -sf -X POST localhost:3000/api/auth/signup -H 'content-type: application/json' \
            -d '{"email":"ci-load@example.com","password":"ci-load-pass-1","display_name":"CI Load"}' | jq -r .token)
          test -n "$TOKEN" && test "$TOKEN" != "null"
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - uses: grafana/setup-k6-action@v1
      - name: Dataset counts before load
        run: psql "$DATABASE_URL" -t -c "SELECT (SELECT count(*) FROM profiles) users,(SELECT count(*) FROM teams) teams,(SELECT count(*) FROM team_members) members,(SELECT count(*) FROM teams t WHERE t.member_count<>(SELECT count(*) FROM team_members m WHERE m.team_id=t.id)) mismatched"
      - name: 'Board endpoint: 100 concurrent users, threshold p95 < 200ms'
        run: |
          set -o pipefail
          k6 version
          k6 run --quiet -e BASE_URL=http://localhost:3000 -e "TOKEN=$TOKEN" --summary-export loadtest/ci-k6-summary.json loadtest/board.k6.js | tee k6-output.txt &
          K6PID=$!
          # Controlled environment profiling: per-process CPU of API vs
          # Postgres vs k6 during the run. Saved into the artifact as
          # ci-profile.txt so the evidence survives the virtualized job log.
          while kill -0 $K6PID 2>/dev/null; do
            ps -eo comm,%cpu --no-headers | awk '{a[$1]+=$2} END {for (k in a) if (a[k]>2) printf "%s=%.0f%% ", k, a[k]; print ""}' | tee -a ci-profile.txt
            sleep 10
          done
          wait $K6PID
      - name: 'Board endpoint: warm rerun (cold vs warm comparison)'
        run: |
          set -o pipefail
          # Same run again immediately after the cold pass: warm connection
          # pools, warmed query plans and OS caches. Cold vs warm p95/p99 is
          # reported in the job summary.
          k6 run --quiet -e BASE_URL=http://localhost:3000 -e "TOKEN=$TOKEN" --summary-export loadtest/ci-k6-warm-summary.json loadtest/board.k6.js | tee k6-warm-output.txt
      - name: "Mixed workload - 99 readers + paced team mutation churn"
        run: |
          set -o pipefail
          k6 run --quiet -e BASE_URL=http://localhost:3000 --summary-export loadtest/ci-k6-mix-summary.json loadtest/board-mix.k6.js | tee k6-mix-output.txt

      - name: Dataset counts after load
        if: always()
        run: psql "$DATABASE_URL" -t -c "SELECT (SELECT count(*) FROM profiles) users,(SELECT count(*) FROM teams) teams,(SELECT count(*) FROM team_members) members,(SELECT count(*) FROM teams t WHERE t.member_count<>(SELECT count(*) FROM team_members m WHERE m.team_id=t.id)) mismatched"
      # Self-reporting summary: the run overview page shows this without
      # needing artifact downloads or log access.
      - name: Publish load result to job summary
        if: always()
        run: |
          node -e '
            const boardRows = (label, file) => {
              const m = require(file).metrics;
              return [
                ["run", label],
                ["p50", m.http_req_duration?.["p(50)"] + "ms"],
                ["p95", m.http_req_duration?.["p(95)"] + "ms"],
                ["p99", m.http_req_duration?.["p(99)"] + "ms"],
                ["avg", m.http_req_duration?.avg + "ms"],
                ["max", m.http_req_duration?.max + "ms"],
                ["requests", m.http_reqs?.count],
                ["failed_requests", m.http_req_failed?.fails ?? Math.round((m.http_req_failed?.value ?? 0) * (m.http_reqs?.count ?? 0))],
                ["failed_req_rate", ((m.http_req_failed?.value ?? 0) * 100).toFixed(3) + "%"],
              ];
            };
            try {
              const cold = boardRows("cold (first pass after fresh seed + API boot)", "./loadtest/ci-k6-summary.json");
              const warm = boardRows("warm (immediate rerun)", "./loadtest/ci-k6-warm-summary.json");
              const lines = ["## k6 board load result (CI stack, 100 VUs / 60s, full seed: 10,000 users / 2,000 teams)", "", "| metric | cold | warm |", "|---|---|---|",
                ...cold.map((r, i) => "| " + r[0] + " | " + r[1] + " | " + warm[i][1] + " |")];
              require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            } catch (e) {
              require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, "## k6 summary parse failed\n```\n" + e.message + "\n```\n");
            }
            try {
              const m = require("./loadtest/ci-k6-mix-summary.json").metrics;
              const board = m["http_req_duration{name:GET /api/board}"] ?? {};
              const rows = [
                ["read p50", board["p(50)"] + "ms"],
                ["read p95", board["p(95)"] + "ms"],
                ["read p99", board["p(99)"] + "ms"],
                ["requests", m.http_reqs?.count],
                ["failed_req_rate", ((m.http_req_failed?.value ?? 0) * 100).toFixed(3) + "%"],
                ["checks", m.checks ? m.checks.passes + "/" + (m.checks.passes + m.checks.fails) : "?"],
                ["full create/join/leave cycles", m.mix_full_cycles?.count],
              ];
              const lines = ["## k6 mixed workload result (99 readers + 4 paced mutators / 60s, full seed)", "", "| metric | value |", "|---|---|",
                ...rows.map(r => "| " + r[0] + " | " + r[1] + " |")];
              require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            } catch (e) {
              require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, "## k6 summary parse failed\n```\n" + e.message + "\n```\n");
            }'
      # k6 v1.x can exit 0 even when a threshold is tainted (observed: run #10
      # green with p95=378ms vs p(95)<200). The summary JSON records the ground
      # truth - fail the job on any tainted threshold explicitly.
      - name: Enforce k6 thresholds
        run: |
          node -e '
            const s = require("./loadtest/ci-k6-summary.json");
            const bad = [];
            for (const [metric, m] of Object.entries(s.metrics ?? {}))
              for (const [th, tainted] of Object.entries(m.thresholds ?? {}))
                if (tainted) bad.push(metric + " " + th);
            if (bad.length) { console.error("Threshold violations:\n" + bad.join("\n")); process.exit(1); }
            console.log("All thresholds OK");
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-ci-results
          path: |
            loadtest/ci-k6-summary.json
            k6-output.txt
            loadtest/ci-k6-warm-summary.json
            k6-warm-output.txt
            ci-profile.txt
            loadtest/ci-k6-mix-summary.json
            k6-mix-output.txt
            api-ci.log
