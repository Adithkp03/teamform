name: Health monitor
# Free-tier production alerting: GitHub emails the repo owner when a scheduled
# run fails, so a red run IS the alert. Best-effort - GitHub can delay or drop
# scheduled runs under load, so this complements (never replaces) the
# in-product metrics and Vercel/Neon dashboards. See docs/operations.md.
on:
  schedule: [{ cron: '*/15 * * * *' }]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: API health answers ok with a commit
        run: |
          body=$(curl -fsS --max-time 20 https://teamform-api.vercel.app/api/health)
          echo "$body"
          echo "$body" | grep -q '"ok":true'
      - name: Metrics endpoint is closed to anonymous callers (organizer-only)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://teamform-api.vercel.app/api/metrics)
          echo "metrics status: $code"
          test "$code" = "401"
      - name: API answers with the security-header policy
        run: |
          curl -fsS --max-time 20 -D - -o /dev/null https://teamform-api.vercel.app/api/health | grep -qi 'x-content-type-options: nosniff'
          curl -fsS --max-time 20 -D - -o /dev/null https://teamform-api.vercel.app/api/health | grep -qi 'x-frame-options: DENY'
      - name: Web app serves
        run: curl -fsS --max-time 20 -o /dev/null https://teamform-web.vercel.app
