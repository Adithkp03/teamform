name: E2E
on: [push, pull_request]
jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teamform_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build web (API on localhost:3100)
        run: VITE_API_URL=http://localhost:3100 npm run build -w @teamform/web
      # Playwright's webServer starts the API (tsx) and vite preview; global
      # setup migrates and seeds a clean database.
      - name: Run browser tests against the SHIPPED serverless bundle (full flow, two-browser realtime, keyboard, axe)
        run: E2E_BUNDLE=1 npx playwright test
      - name: Publish result
        if: always()
        run: |
          echo '## E2E (Playwright)' >> "$GITHUB_STEP_SUMMARY"
          echo '- full team-formation flow, two-browser live updates, keyboard-only, axe accessibility' >> "$GITHUB_STEP_SUMMARY"
          echo "- result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
