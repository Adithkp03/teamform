server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers mirror apps/web/vercel.json (production) so the
  # self-hosted and hosted deployments behave the same.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  # Same-origin API here, so connect-src 'self' + Firebase/Google auth.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com; frame-ancestors 'none'; base-uri 'self'" always;

  # API reverse proxy (same origin for the SPA). Buffering off for SSE.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  # SPA fallback
  location / {
    try_files $uri /index.html;
  }
}
